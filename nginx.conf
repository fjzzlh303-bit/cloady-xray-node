# 最小 nginx 配置：3000 上的公网入口，按路径分流到本机服务。
# Cloady 一个应用只有一个公网主机名（主端点 3000），
# 因此三个服务共享 3000，用路径区分：
#   /ray   → Xray VLESS+WS（本机 10000）
#   /xhttp → Xray VLESS+XHTTP（本机 10001）
#   /      → 流量表静态页（/www，meter.sh 每 60 秒写）
# 由 entrypoint.sh 渲染 Xray 配置；本文件直接随镜像发布。
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;
events {
    worker_connections 1024;
}
http {
    access_log off;
    sendfile on;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    server {
        listen 3000;
        server_name _;
        # VLESS+WS：/ray → 本机 Xray WS 入站
        location /ray {
            proxy_pass http://127.0.0.1:10000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        # VLESS+XHTTP：/xhttp → 本机 Xray XHTTP 入站
        location /xhttp {
            proxy_pass http://127.0.0.1:10001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        # 流量表：/ 与 /traffic.json → /www 静态文件
        location / {
            root /www;
            index index.html;
        }
    }
}
